<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFD93B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sidenote">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M3 3h26v17l-9 9H3z' fill='%23FFD93B' stroke='%2316233B' stroke-width='2' stroke-linejoin='round'/%3E%3Ccircle cx='11.5' cy='13' r='2.1' fill='%2316233B'/%3E%3Ccircle cx='20.5' cy='13' r='2.1' fill='%2316233B'/%3E%3C/svg%3E">
<title>Sidenote: the half of the lecture that is not on the slides</title>
<style>
:root{
  --ink:#16233B; --text:#27303F; --muted:#637083; --line:#DDE3EC; --bg:#F4F6FB; --surface:#FFFFFF;
  --blue:#2B59FF; --blue-soft:#E9EEFF; --yellow:#FFD93B; --yellow-soft:#FFF5C7; --yellow-deep:#E0B400;
  --coral:#FF6B57; --coral-soft:#FFE6E1; --mint:#19B88A; --mint-soft:#DDF6EC; --violet:#7A5AF8; --violet-soft:#ECE7FF;
  --amber:#B45309; --amber-soft:#FDEFD3; --green:#157A55; --red:#B42318; --red-soft:#FBE7E4;
  --r-sm:8px; --r:14px; --r-lg:22px;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--sans);color:var(--text);background:var(--bg);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3{color:var(--ink);letter-spacing:-.025em;line-height:1.12}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--ink);background:var(--surface);padding:10px 18px;border-radius:99px;font-weight:700;font-size:15px;color:var(--ink);text-decoration:none;transition:transform .12s,box-shadow .12s;box-shadow:0 3px 0 var(--ink)}
.btn:hover{text-decoration:none;transform:translateY(-1px);box-shadow:0 4px 0 var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.btn.primary{background:var(--yellow)}
.btn.dark{background:var(--ink);color:#fff}
.btn.blue{background:var(--blue);color:#fff}
.btn.plain{border-color:var(--line);box-shadow:none;font-weight:600}
.btn.plain:hover{transform:none;border-color:#B8C2D2;box-shadow:none}
.btn.sm{padding:7px 14px;font-size:14px}
.tag{display:inline-block;font-size:12.5px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--blue-soft);color:var(--blue);white-space:nowrap}
.tag.amber{background:var(--amber-soft);color:var(--amber)}
.tag.sn{background:var(--yellow);color:#3D3000}
.tag.grey{background:#EAEEF4;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.sid{display:inline-block;flex:none;transform:rotate(-6deg)}
.sid .eye{animation:blink 5.5s infinite;transform-origin:center;transform-box:fill-box}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}

/* ---------- public ---------- */
.pub{background:#fff}
.dots{background-image:radial-gradient(#D5DCE8 1.2px,transparent 1.2px);background-size:22px 22px}
.pub-nav{display:flex;align-items:center;gap:22px;max-width:1140px;margin:0 auto;padding:18px 24px}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:21px;color:var(--ink);letter-spacing:-.035em}
.logo:hover{text-decoration:none}
.logo:hover .sid{transform:rotate(6deg);transition:transform .2s}
.pub-nav .sp{flex:1}
.pub-nav a.l{color:var(--text);font-size:15px;font-weight:600}
.wrap{max-width:1140px;margin:0 auto;padding:0 24px}
.hero{display:grid;grid-template-columns:1fr 1.05fr;gap:40px;align-items:center;padding:36px 0 64px}
.hero h1{font-size:clamp(38px,5.2vw,62px);font-weight:820;letter-spacing:-.04em}
.hero .lead{font-size:19px;color:var(--muted);margin:20px 0 28px;max-width:32em}
.cta{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.niche{margin-top:22px;display:flex;gap:10px;align-items:center;font-size:14.5px;color:var(--muted)}
.stage{position:relative;height:440px}
.slide{position:absolute;left:14%;top:70px;width:64%;aspect-ratio:16/10;background:#fff;border:2px solid var(--ink);border-radius:12px;padding:22px 24px;box-shadow:8px 8px 0 var(--blue-soft)}
.slide h4{font-size:19px;color:var(--ink);margin:0 0 14px}
.slide li{color:#8A95A6;font-size:14px;margin-bottom:7px}
.slide ul{margin:0;padding-left:18px}
.slide .pg{position:absolute;right:16px;bottom:10px;font-size:12px;color:#9AA4B4}
.rec{position:absolute;left:14%;top:22px;display:flex;gap:8px;align-items:center;background:var(--ink);color:#fff;padding:6px 14px;border-radius:99px;font-size:13.5px;font-weight:700}
.rec i{width:9px;height:9px;border-radius:50%;background:var(--coral);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
.sticky-w{position:absolute;width:212px;filter:drop-shadow(0 8px 10px rgba(22,35,59,.16));transform:rotate(var(--rot));animation:pop .5s cubic-bezier(.2,1.4,.4,1) both;animation-delay:var(--d)}
.sticky{background:var(--c);padding:12px 14px 16px;font-size:13.5px;line-height:1.4;color:var(--ink);clip-path:polygon(0 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%)}
.sticky b{display:block;font-size:12.5px;margin-bottom:3px;opacity:.7}
@keyframes pop{from{opacity:0;transform:rotate(var(--rot)) scale(.5) translateY(14px)}to{opacity:1;transform:rotate(var(--rot)) scale(1)}}
.said{padding:64px 0;background:var(--ink);color:#fff}
.said h2{color:#fff;font-size:32px;max-width:20em}
.said p{color:#B5C0D4;margin-top:10px;max-width:38em}
.cloud{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.bub{padding:10px 16px;border-radius:18px 18px 18px 4px;background:#253655;color:#D5DDEB;font-size:15.5px}
.bub.flag{background:var(--yellow);color:#2B2300;font-weight:700}
.bub.flag::after{content:" caught";font-size:12px;font-weight:800;background:var(--ink);color:var(--yellow);padding:2px 8px;border-radius:99px;margin-left:8px}
.sect{padding:72px 0}
.sect h2{font-size:34px;max-width:18em}
.bento{display:grid;grid-template-columns:repeat(6,1fr);gap:16px;margin-top:32px}
.bx{border-radius:var(--r-lg);padding:24px;min-height:210px;display:flex;flex-direction:column;gap:8px;border:2px solid var(--ink)}
.bx h3{font-size:20px}
.bx p{font-size:15px;color:#3B4658}
.bx .art{margin-top:auto;padding-top:14px}
.b1{grid-column:span 4;background:var(--yellow-soft)} .b2{grid-column:span 2;background:var(--blue-soft)}
.b3{grid-column:span 2;background:var(--coral-soft)} .b4{grid-column:span 2;background:var(--mint-soft)} .b5{grid-column:span 2;background:var(--violet-soft)}
.b6{grid-column:span 6;background:#fff;flex-direction:row;align-items:center;gap:28px;min-height:0}
.mini{background:#fff;border:1.5px solid var(--ink);border-radius:10px;padding:10px 12px;font-size:13.5px;color:var(--ink)}
.chat{display:grid;gap:6px;max-width:320px;flex:none}
.chat .m{background:#EEF1F6;border-radius:14px 14px 14px 4px;padding:8px 12px;font-size:14px;width:fit-content}
.chat .m.me{background:var(--blue);color:#fff;border-radius:14px 14px 4px 14px;margin-left:auto}
.ways{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:28px}
.ways .card{padding:22px;border-width:2px;border-color:var(--ink);border-radius:var(--r-lg)}
.ways svg{margin-bottom:10px}
.end{background:var(--yellow);padding:56px 0;text-align:center}
.end h2{font-size:36px;margin:14px auto 22px;max-width:16em}
footer.f{padding:26px 0 44px;color:var(--muted);font-size:14px;background:#fff}

/* ---------- app shell ---------- */
.shell{display:grid;grid-template-columns:256px 1fr;min-height:100vh}
.side{background:#fff;border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.side .logo{padding:2px 8px 16px}
.side .new{margin:4px 4px 14px}
.side a.n{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r-sm);color:var(--text);font-size:15px;font-weight:600}
.side a.n:hover{background:var(--bg);text-decoration:none}
.side a.n.on{background:var(--ink);color:#fff}
.side a.n .ct{margin-left:auto;font-weight:500;opacity:.7}
.cdot{width:11px;height:11px;border-radius:4px;flex:none}
.side .lbl{font-size:13px;color:var(--muted);padding:16px 10px 6px}
.streak{margin-top:auto;background:var(--yellow-soft);border-radius:var(--r);padding:14px}
.streak b{color:var(--ink)}
.days{display:flex;gap:6px;margin-top:10px}
.days span{flex:1;text-align:center;font-size:11.5px;font-weight:700;padding:5px 0;border-radius:6px;background:#fff;color:var(--muted)}
.days span.d{background:var(--ink);color:var(--yellow)}
.main{padding:32px 40px 80px;min-width:0}
.main>.inner{max-width:1000px}
.crumb{font-size:14px;color:var(--muted);margin-bottom:8px}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.page-h h1{font-size:32px;font-weight:800}
.hello{display:flex;gap:14px;align-items:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}
.stat{padding:16px 18px;border-radius:var(--r);display:flex;flex-direction:column}
.stat b{font-size:30px;color:var(--ink);line-height:1.1;font-weight:800}
.stat span{font-size:14px;color:#3B4658}
.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:20px;align-items:start}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:14px;align-items:center;padding:13px 18px;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.grow{flex:1;min-width:0}
.list .t{font-weight:700;color:var(--ink)}
.sec-h{font-size:17px;padding:16px 18px 4px}
.count{flex:none;width:58px;height:58px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;background:var(--amber-soft);color:var(--amber)}
.count b{font-size:22px;font-weight:800}
.count span{font-size:11.5px;font-weight:700}
.courses{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:12px}
.courses a{display:block;color:inherit;overflow:hidden;border-radius:var(--r);border:1px solid var(--line);background:#fff;transition:transform .12s}
.courses a:hover{text-decoration:none;transform:translateY(-3px)}
.courses .top{height:64px;padding:14px 16px;color:#fff;font-weight:800;font-size:19px;letter-spacing:-.02em}
.courses .bot{padding:12px 16px 14px}

/* ---------- lecture ---------- */
.tl{position:relative;height:46px;margin:6px 0 4px}
.tl .track{position:absolute;left:0;right:0;top:17px;height:14px;border-radius:9px;background:#E3E8F0;overflow:hidden;display:flex}
.tl .seg{height:100%;border:0;border-right:2px solid var(--bg);padding:0;cursor:pointer;opacity:.45}
.tl .seg:hover,.tl .seg.on{opacity:1}
.tl .mk{position:absolute;top:2px;width:20px;height:20px;margin-left:-10px;border:0;background:none;padding:0}
.tl .mk::before{content:"!";position:absolute;inset:0;border-radius:50%;background:var(--yellow);border:2px solid var(--ink);font-size:12px;font-weight:800;line-height:16px;color:var(--ink);text-align:center}
.tl .head{position:absolute;top:12px;width:5px;height:24px;margin-left:-2px;background:var(--ink);border-radius:3px;transition:left .25s}
.tl-ends{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.tabs{display:flex;gap:6px;margin:22px 0 20px;overflow-x:auto;padding-bottom:2px}
.tabs button{border:2px solid transparent;background:#E7EBF2;padding:8px 16px;font-weight:700;color:var(--muted);border-radius:99px;white-space:nowrap}
.tabs button.on{color:#fff;background:var(--ink)}
.alert{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;background:var(--amber-soft);border-radius:var(--r-sm);margin-bottom:8px;font-size:15px}
.alert .ts{margin-left:auto}
.ts{border:0;background:none;padding:0;color:var(--blue);font-weight:700;font-size:13.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.ts:hover{text-decoration:underline}
.nsec{padding:20px 22px;margin-bottom:14px}
.nsec h3{font-size:19px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pt{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line);margin-top:10px;align-items:start}
.pt.off .body{background:var(--yellow-soft);padding:9px 12px 12px;transform:rotate(-.4deg);clip-path:polygon(0 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%)}
.pt .zh{color:var(--muted);font-size:14.5px;margin-top:4px}
.tools{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:16px;font-size:14.5px;font-weight:600}
.tools label{display:flex;gap:7px;align-items:center;cursor:pointer}
.seg-line{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:9px 10px;border-radius:var(--r-sm)}
.seg-line.hit{background:var(--yellow-soft)}
.fc{max-width:560px;margin:0 auto;text-align:center;perspective:1200px}
.flip{position:relative;width:100%;height:250px;border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .45s}
.flip.on{transform:rotateY(180deg)}
.flip .f{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:32px;border-radius:var(--r-lg);border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;font-size:21px;font-weight:700;color:var(--ink);line-height:1.35;background:#fff;box-shadow:6px 6px 0 var(--violet-soft)}
.flip .f.b{transform:rotateY(180deg);background:var(--violet-soft);font-weight:600;font-size:18px;box-shadow:6px 6px 0 #fff}
.fc .ctl{display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap}
.pips{display:flex;gap:5px;justify-content:center;margin-bottom:14px}
.pips i{width:26px;height:6px;border-radius:9px;background:#DCE2EC}
.pips i.k{background:var(--mint)} .pips i.c{background:var(--ink)}
.qz{max-width:640px;margin:0 auto}
.qz .opt{display:block;width:100%;text-align:left;padding:13px 16px;margin-top:10px;border:2px solid var(--line);border-radius:var(--r);background:var(--surface);font-weight:600}
.qz .opt:hover:not(:disabled){border-color:var(--ink)}
.qz .opt.ok{background:var(--mint-soft);border-color:var(--mint);color:var(--green)}
.qz .opt.no{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.qz .why{margin-top:14px;padding:12px 16px;background:#EEF1F6;border-radius:var(--r-sm);font-size:15px;display:flex;gap:12px;align-items:flex-start}
.result{position:relative;overflow:hidden;padding:36px 28px;text-align:center;border-radius:var(--r-lg);border:2px solid var(--ink)}
.conf{position:absolute;top:-12px;width:9px;height:14px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(340px) rotate(540deg);opacity:0}}
.shared-bar{background:var(--yellow);color:var(--ink);padding:9px 0;font-size:14.5px;font-weight:600}
.shared-bar .wrap{display:flex;gap:10px;align-items:center}
.sticky-cta{position:sticky;bottom:0;background:#fff;border-top:2px solid var(--ink);padding:14px 0;margin-top:40px}
.sticky-cta .wrap{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}

/* ---------- new / live ---------- */
.choice{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 0}
.choice button{padding:18px;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:var(--r)}
.choice button.on{border-color:var(--ink);box-shadow:4px 4px 0 var(--yellow)}
.choice b{display:block;color:var(--ink);margin-bottom:4px}
.field{display:block;margin-bottom:16px}
.field>span{display:block;font-size:14px;font-weight:700;color:var(--ink);margin-bottom:6px}
.field input,.field select{width:100%;font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:var(--r-sm);background:var(--surface);color:var(--text)}
.drop{border:2px dashed #B8C2D2;border-radius:var(--r);padding:24px;text-align:center;color:var(--muted);background:var(--surface)}
.live-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.dot{width:14px;height:14px;border-radius:50%;background:var(--coral);animation:pulse 1.4s infinite}
.paused .dot{animation:none;background:var(--muted)}
.clock{font-size:44px;font-weight:820;color:var(--ink);letter-spacing:-.03em}
.live-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;margin-top:20px;align-items:start}
.stream{padding:8px 12px;min-height:320px;max-height:460px;overflow:auto}
.catch{padding:20px;background:var(--yellow-soft);border:2px solid var(--ink);border-radius:var(--r-lg)}
.note-demo{font-size:13px;color:var(--muted);margin-top:10px}

.modal{position:fixed;inset:0;background:rgba(22,35,59,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.modal .box{background:var(--surface);border-radius:var(--r-lg);border:2px solid var(--ink);padding:26px;max-width:480px;width:100%}
.modal h3{font-size:22px;margin-bottom:8px}
.copy{display:flex;gap:8px;margin:16px 0}
.copy input{flex:1;font:inherit;font-size:14.5px;padding:9px 12px;border:1.5px solid var(--line);border-radius:var(--r-sm);background:var(--bg);min-width:0}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:14.5px;font-weight:600;z-index:30}

@media (max-width:900px){
  .hero{grid-template-columns:1fr;padding-top:12px}
  .stage{height:auto;padding-top:56px}
  .slide{position:relative;left:0;top:0;width:100%}
  .rec{left:0;top:8px}
  .sticky-w{position:relative;left:auto!important;right:auto!important;top:auto!important;bottom:auto!important;width:86%;margin:12px 0 0 auto}
  .sticky-w:nth-of-type(odd){margin-left:0}
  .bento{grid-template-columns:1fr}.bx{grid-column:auto!important}.b6{flex-direction:column;align-items:flex-start}
  .ways,.choice,.grid2,.live-grid,.stats{grid-template-columns:1fr}
  .pub-nav a.l{display:none}
  .tl-ends span:nth-child(2){display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- additions: auth, states, slides view, recording ---------- */
button:disabled{opacity:.55;cursor:not-allowed}
.btn{white-space:nowrap}
.center{min-height:70vh;display:flex;align-items:center;justify-content:center;padding:24px}
.auth{max-width:430px;width:100%;padding:28px;border:2px solid var(--ink);border-radius:var(--r-lg);background:#fff;box-shadow:8px 8px 0 var(--yellow)}
.err{color:var(--red);font-size:14.5px;font-weight:600;margin:-4px 0 14px}
.pill-rec{display:inline-flex;gap:8px;align-items:center;background:var(--ink);color:#fff;padding:7px 16px;border-radius:99px;font-weight:700;font-size:14px;margin-bottom:16px}
.pill-rec:hover{text-decoration:none}
.pill-rec i{width:9px;height:9px;border-radius:50%;background:var(--coral);animation:pulse 1.4s infinite}
.lvl{width:130px;height:7px;border-radius:9px;background:#E3E8F0;overflow:hidden;margin-top:5px}
.lvl b{display:block;height:100%;width:0;background:var(--mint);transition:width .1s}
.ubar{height:10px;border-radius:9px;background:#E3E8F0;overflow:hidden}
.ubar b{display:block;height:100%;background:var(--ink)}
.srow{display:grid;grid-template-columns:200px 1fr;gap:20px;padding:18px 0;border-top:1px solid var(--line);align-items:start}
.srow:first-child{border-top:0}
.srow .pt:first-child{border-top:0;margin-top:0;padding-top:0}
.thumb{aspect-ratio:16/10;border:2px solid var(--ink);border-radius:10px;background:#fff;padding:12px;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);box-shadow:4px 4px 0 var(--blue-soft);overflow:hidden}
.thumb b{color:var(--ink);font-size:14.5px;line-height:1.25}

<script>
/* =====================================================================
   SIDENOTE FRONT END
   One file, no build step, no dependencies.

   For the backend developer:
   1. Set CONFIG.USE_MOCK = false and CONFIG.API_BASE to your server.
   2. Every network call goes through the `api` object below. Each function
      has a mock branch (answers from DATA) and a real branch (calls http()).
      Keep the return shapes and the UI needs no other change.
   3. DATA is sample content only. It is never read outside the mock branches.
   See INTEGRATION.md for the endpoint list and data shapes.
   ===================================================================== */
const CONFIG = {
  USE_MOCK: true,          // false = talk to the real backend
  API_BASE: "/api",        // prefix for every request
  CHUNK_SECONDS: 15,       // how often recorded audio is sent while recording
  AUDIO_KBPS: 32,          // recording bitrate. 32 kbps is plenty for speech: a 90 minute lecture is about 22 MB
  POLL_MS: 3000,           // how often to ask whether notes are ready
  MAX_UPLOAD_MB: 500,
  EXAMPLE_SHARE_ID: "econ-w9", // the shared lecture behind "Example notes" on the public pages. null hides those links
  SHARE_AUDIO: false       // true = classmates with a share link can also play the recording
};

/* SAMPLE DATA: used only by the mock branches of `api`. Times are seconds from the start of the recording. */
const DATA = {
  user: { name: "Jasper", minutesToday: 90, minutesLimit: 240 },
  courses: [
    { id: "econ1001", code: "ECON 1001", name: "Principles of Microeconomics" },

    { id: "econ-w8", course: "econ1001", title: "Consumer choice and budget constraints", week: 8, date: "Tue 3 Nov", duration: 5280 },
    { id: "econ-w7", course: "econ1001", title: "Elasticity and its applications", week: 7, date: "Tue 27 Oct", duration: 5340 },
    { id: "math-w9", course: "math2011", title: "Lagrange multipliers", week: 9, date: "Mon 9 Nov", duration: 4800 },

  upcoming: [
    { day: "16", mon: "Nov", kind: "Deadline", text: "Problem set 4 due 23:59 on Canvas", course: "ECON 1001", lecture: "econ-w9", t: 3120 },
    { day: "19", mon: "Nov", kind: "Quiz", text: "In-class quiz on constrained optimisation", course: "MATH 2011", lecture: "math-w9", t: 95 },

    alerts: [
      { t: 18, kind: "Midterm", text: "Midterm on Thu 26 Nov in LT-A, chapters 1 to 4. Closed book, one A4 page of notes allowed." },
      { t: 3120, kind: "Deadline", text: "Problem set 4 is due Mon 16 Nov at 23:59 on Canvas." },
      { t: 4388, kind: "Exam hint", text: "The lecturer said working out opportunity cost from a two-good table “will be on the midterm”." }
    ],
    sections: [
      { title: "Opportunity cost", slides: "Slides 3 to 6", start: 200, end: 640, points: [
        { t: 252, text: "The opportunity cost of a choice is the value of the best alternative you gave up. It is not the sum of every alternative.", zh: "机会成本是你放弃的“最好的那一个”选项的价值，不是所有选项加起来。" },
        { t: 408, off: true, text: "It includes costs you never pay in cash. The lecturer's example: a year at university costs the tuition plus the salary you did not earn.", zh: "包括隐性成本：读一年大学的成本 = 学费 + 没去工作少赚的工资。" },
        { t: 570, text: "A cost that is the same under every option does not affect the decision, so leave it out.", zh: "每个选项都一样的成本不影响决策，可以忽略。" } ] },
      { title: "Sunk costs and thinking at the margin", slides: "Slides 7 to 9", start: 640, end: 1380, points: [
        { t: 663, text: "A sunk cost cannot be recovered whatever you choose next, so a rational decision ignores it.", zh: "沉没成本无论怎么选都收不回来，理性决策不应考虑它。" },
        { t: 860, off: true, text: "Concert ticket example: you paid $400 and feel ill on the day. Compare only the enjoyment of going with the comfort of staying home. The $400 is gone either way.", zh: "演唱会门票例子：票钱已经花了，只比较“去”和“不去”哪个更好。" },
        { t: 1065, text: "Decide by comparing marginal benefit with marginal cost: do one more unit only while the extra benefit is at least the extra cost.", zh: "边际分析：多做一单位的额外收益 ≥ 额外成本时才做。" } ] },
      { title: "Production possibilities frontier", slides: "Slides 10 to 15", start: 1380, end: 2700, points: [
        { t: 1450, text: "The PPF shows the maximum combinations of two goods an economy can produce with its current resources and technology.", zh: "生产可能性边界：现有资源和技术下两种商品的最大产量组合。" },
        { t: 1652, text: "The slope of the PPF is the opportunity cost of the good on the horizontal axis, measured in units of the other good.", zh: "PPF 的斜率 = 横轴商品的机会成本。" },
        { t: 1865, text: "A bowed-out PPF means opportunity cost rises as you produce more of one good, because resources are not equally suited to both.", zh: "向外凸的 PPF 表示机会成本递增。" },
        { t: 2140, text: "Points inside the frontier are inefficient and points outside are unattainable. Growth shifts the whole frontier outward.", zh: "边界内：无效率；边界外：做不到；经济增长使边界外移。" } ] },
      { title: "Absolute and comparative advantage", slides: "Slides 16 to 22", start: 2700, end: 3900, points: [
        { t: 2775, text: "Absolute advantage means producing more with the same inputs. Comparative advantage means producing at a lower opportunity cost.", zh: "绝对优势：同样投入产出更多；比较优势：机会成本更低。" },
        { t: 3190, text: "Worked example. Country A makes 10 cloth or 5 wine per worker, so 1 wine costs 2 cloth. Country B makes 6 cloth or 2 wine, so 1 wine costs 3 cloth. A has the comparative advantage in wine and B in cloth.", zh: "例题：A 国 1 酒 = 2 布，B 国 1 酒 = 3 布，所以 A 在酒上有比较优势，B 在布上有比较优势。" },

      { title: "Gains from trade", slides: "Slides 23 to 27", start: 3900, end: 5400, points: [
        { t: 4000, text: "Both countries gain when the price of wine in trade lies between their two opportunity costs, here between 2 and 3 cloth per wine.", zh: "贸易条件落在两国机会成本之间（2 到 3 布换 1 酒）时，双方都获益。" },

        { t: 4815, text: "Next week covers supply and demand. Read chapter 4 before class.", zh: "下周讲供给与需求，课前读第 4 章。" } ] }

      { t: 18, text: "Before we start, a reminder that the midterm is on Thursday the twenty-sixth of November in LT-A. It covers chapters one to four, it's closed book, and you may bring one A4 page of notes." },
      { t: 252, text: "So the opportunity cost is the value of the best thing you gave up. Not everything you gave up. Just the best one." },
      { t: 408, text: "Think about being here this year. You pay tuition, yes, but you also could have been working. That salary you didn't earn is part of the cost, even though nobody sends you a bill for it." },
      { t: 663, text: "A sunk cost is money that's gone whatever you do next. And because it's gone either way, it shouldn't change your decision." },
      { t: 860, text: "Say you bought a concert ticket for four hundred dollars and you wake up feeling ill. The four hundred is gone whether you go or not. The only question is whether tonight is better at the concert or at home." },
      { t: 1652, text: "The slope here tells you how much of the good on the vertical axis you give up to get one more unit of the good on the horizontal axis. That's the opportunity cost." },
      { t: 2775, text: "Absolute advantage is about who makes more. Comparative advantage is about who gives up less. Keep those two apart." },
      { t: 3120, text: "Problem set four is on Canvas. It's due Monday the sixteenth at eleven fifty-nine p.m." },
      { t: 3510, text: "This is where people lose marks. A country can be better at everything. It cannot have the comparative advantage in everything, because the opportunity costs are reciprocals of each other." },
      { t: 4388, text: "A question like this table, two countries and two goods, will be on the midterm. Compute the opportunity costs and tell me who exports what." },

async function http(method, path, body, anon) {   // anon = a public endpoint: no token is sent and a 401 is an ordinary error
  const isForm = body instanceof FormData;
  const headers = {};
  if (S.token && !anon) headers.Authorization = "Bearer " + S.token;
  if (body && !isForm) headers["Content-Type"] = "application/json";
  const r = await fetch(CONFIG.API_BASE + path, { method, headers, body: isForm ? body : body ? JSON.stringify(body) : undefined });
  if (r.status === 401 && !anon) { session.clear(); if (location.hash !== "#/signin") S.next = location.hash; location.hash = "#/signin"; throw Object.assign(new Error("Please sign in again."), { status: 401 }); }
  if (!r.ok) { let m = r.statusText; try { m = (await r.json()).message || m; } catch (e) {} throw Object.assign(new Error(m || "Request failed"), { status: r.status }); }
  const text = r.status === 204 ? "" : await r.text();
  if (!text.trim()) return null;   // endpoints with nothing to return may answer 204 or an empty 200
  try { return JSON.parse(text); } catch (e) { throw new Error("The server sent a reply Sidenote could not read."); }
}

function timeline(d, dur, pos) {
  dur = dur || 1; const first = d.sections[0] ? d.sections[0].start : 0;
  const segs = d.sections.map((s, i) => `<button class="seg ${pos >= s.start && pos < s.end ? "on" : ""}" style="width:${(s.end - s.start) / dur * 100}%;background:${PALETTE[(i + 3) % 5]}" title="${esc(s.title)}" aria-label="${esc(s.title)}" onclick="jump(${+(s.points[0] ? s.points[0].t : s.start)})"></button>`).join("");
  const mks = d.alerts.map(a => `<button class="mk" style="left:${a.t / dur * 100}%" title="${esc(a.kind)} at ${fmt(a.t)}" aria-label="${esc(a.kind)} at ${fmt(a.t)}" onclick="jump(${+a.t})"></button>`).join("");
  return `<div class="tl"><div class="track"><span style="width:${first / dur * 100}%"></span>${segs}</div>${mks}<div class="head" style="left:${Math.min(100, pos / dur * 100)}%"></div></div>
  <div class="tl-ends num"><span>0:00</span><span>One colour per topic. Exam and deadline mentions are marked with !</span><span>${fmt(dur)}</span></div>`;
}
function confetti() { const cs = ["#FFD93B", "#FF6B57", "#19B88A", "#7A5AF8", "#2B59FF"]; return Array.from({ length: 26 }, (_, i) => `<i class="conf" style="left:${(i * 37) % 100}%;background:${cs[i % 5]};animation-delay:${(i % 7) * .08}s"></i>`).join(""); }
/* 中文解釋 can be read in Traditional or Simplified characters. The backend sends both (point.zhHant, point.zhHans) and the
   reader chooses. Signed in, the choice lives in the account settings; otherwise it is remembered on this device.
   Until someone chooses, a browser set to Simplified Chinese starts with Simplified and every other browser with Traditional. */
const zhScript = () => (S.token && S.settings.zhScript) || store.get("zhScript") || (/^zh-(cn|sg|my)\b|^zh-hans/i.test(navigator.language || "") ? "hans" : "hant");
const zhText = p => (zhScript() === "hans" ? p.zhHans || p.zhHant : p.zhHant || p.zhHans) || p.zh || "";
function setZhScript(v) { store.set("zhScript", v);
  if (S.token) { S.settings.zhScript = v; if (S.homeLoaded) api.updateSettings({ name: S.user.name, classLanguage: S.settings.classLanguage, zhDefault: S.settings.zhDefault, zhScript: v }).catch(() => {}); }
  render(); }
const zhPick = d => { const hans = zhScript() === "hans";   // only offered when this lecture really has both forms
  return state.zh && d.sections.some(s => s.points.some(p => p.zhHant && p.zhHans)) ? `<span class="seg2" role="group" aria-label="Chinese characters"><button class="${hans ? "" : "on"}" aria-pressed="${!hans}" onclick="setZhScript('hant')" data-notr>繁</button><button class="${hans ? "on" : ""}" aria-pressed="${hans}" onclick="setZhScript('hans')" data-notr>简</button></span>` : ""; };
function ptHtml(p, si, pi) { const own = cur && !cur.shared && state.edit;
  return `<div class="pt ${p.off ? "off" : ""}">${p.t != null ? `<button class="ts" onclick="jump(${+p.t})" aria-label="Open transcript at ${fmt(p.t)}">${fmt(p.t)}</button>` : `<span class="tag grey">You</span>`}<div class="body">${p.off ? `<span class="tag sn">Sidenote</span> ` : ""}<span data-notr>${esc(p.text)}</span>${state.zh && zhText(p) ? `<div class="zh" data-notr lang="${zhScript() === "hans" ? "zh-Hans" : "zh-Hant"}">${esc(zhText(p))}</div>` : ""}${own ? `<div class="pt-acts"><button class="ts" onclick="editPoint(${si},${pi})">Edit</button><button class="ts" style="color:var(--red)" onclick="delPoint(${si},${pi})">Delete</button></div>` : ""}</div></div>`; }
function lectureBody() {
  const { l, c, d, shared } = cur;
  if (!d) {
    const box = (mood, h, p, btn) => `<div class="card" style="padding:28px;display:flex;gap:18px;align-items:center;flex-wrap:wrap">${sid(52, mood)}<div class="grow"><h3>${h}</h3><p class="muted" style="margin:8px 0 16px">${p}</p>${btn}</div></div>`;
    if (l.status === "failed") return box("sad", "These notes could not be written", "Your recording is safe. Sid can try again from it.", `<button class="btn primary" onclick="retryNotes(false)">Try again</button>`);
    if (l.status === "recording") return live.active && live.id === l.id
      ? box("wow", "This lecture is being recorded", "The notes are written when you end the recording.", `<a class="btn primary" href="#/live">Return to the recording</a>`)
      : box("plain", "This recording was not finished", "The page was closed before the recording ended. Sid can still write notes from the part that was saved.", `<button class="btn primary" onclick="${S.orphan && S.orphan.id === l.id ? "recoverOrphan()" : "retryNotes(true)"}">Make notes from what was saved</button>`);
    if (CONFIG.USE_MOCK && l.status !== "processing") return box("plain", `<span data-notr>${esc(l.title)}</span>`, "The sample data has full notes for one lecture, ECON 1001 week 9. Every lecture uses this same page.", `<a class="btn primary" href="#/lecture/econ-w9">Open ECON 1001 week 9</a>`);
    return box("wow", "Sid is still writing these notes", "This usually takes a minute or two after the lecture ends.", `<button class="btn primary" onclick="refreshLecture()">Check again</button>`);
  }
  const audio = hasAudio(); if (audio) plLoad(); else plStop();

   down in background tabs the way timers are, so the answer arrives at once. */
const recChan = (() => { try { const c = new BroadcastChannel("sidenote-rec"); c.addEventListener("message", e => { if (e.data === "ping" && live.active) c.postMessage("alive:" + live.id); }); return c; } catch (e) { return null; } })();
function recordingElsewhere(m) { return new Promise(res => {
  if (!recChan) return res(m && m.at && Date.now() - m.at < 90000 ? m.id : null);   // no channel in this browser: trust a recent heartbeat instead
  const done = id => { recChan.removeEventListener("message", on); res(id); }, on = e => { if (String(e.data).indexOf("alive:") === 0) done(String(e.data).slice(6)); };
  recChan.addEventListener("message", on); recChan.postMessage("ping"); setTimeout(() => done(null), 400); }); }
async function findOrphan() { let m = null; try { m = JSON.parse(store.get("live") || "null"); } catch (e) {}
  let all = (await idb.all()) || []; if (!m && !all.length) return;
  const busyId = live.active ? live.id : await recordingElsewhere(m);   // a recording that is running right now, here or in another tab, is not an interrupted one
  if (busyId) { all = all.filter(c => c.id !== busyId); if (m && m.id === busyId) m = null; if (!m && !all.length) return; }
  const id = m ? m.id : all[0].id, chunks = all.filter(c => c.id === id).sort((a, b) => a.seq - b.seq);
  S.orphan = { id, code: m ? m.code : (chunks[0] && chunks[0].code) || "", sec: Math.max(m ? m.sec : 0, ...chunks.map(c => c.sec || 0)), chunks }; }
function orphanHtml() { const o = S.orphan; if (!o || live.active) return "";
  return `<div class="alert" style="align-items:center;flex-wrap:wrap"><span class="tag amber">Unfinished</span><span>A recording${o.code ? " of " + esc(o.code) : ""} was interrupted at ${fmt(o.sec)}, before its notes were made.</span><span style="margin-left:auto;display:flex;gap:14px"><button class="ts" onclick="recoverOrphan()">Make notes from it</button><button class="ts" style="color:var(--red)" onclick="dropOrphan()">Discard it</button></span></div>`; }
function recoverOrphan() { const o = S.orphan; S.orphan = null; o.chunks.forEach(c => outbox.push(c)); render(); finishAfterUpload(o.id, o.sec); }
async function dropOrphan() { const o = S.orphan; S.orphan = null; unmark(); for (const c of o.chunks) await idb.del(c.key); api.deleteLecture(o.id).catch(() => {}); toast("Recording discarded"); render(); }

/* ---------- online class: record the sound of a browser tab ---------- */
const CAN_TAB = !!(navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia);   // phones cannot share a tab
async function tabStream() {
  if (!navigator.mediaDevices.getDisplayMedia) throw Object.assign(new Error(), { name: "NotSupportedError" });
  const s = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true }), a = s.getAudioTracks();
  if (!a.length) { s.getTracks().forEach(t => t.stop()); throw Object.assign(new Error(), { name: "NoAudioError" }); }
  rec.full = s; a[0].onended = () => { if (live.active) { toast("Sharing stopped, so the recording has ended."); endLive(); } };
  return new MediaStream(a);
}

function download(name, text, type) { const a = document.createElement("a"), url = URL.createObjectURL(new Blob([text], { type: type + ";charset=utf-8" })); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000); toast("Downloaded " + name); }
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9一-鿿]+/g, "-").replace(/^-|-$/g, "").slice(0, 60) || "lecture";
const oneLine = s => String(s).replace(/\s+/g, " ").trim();
function notesMarkdown() { const { l, c, d } = cur; let o = "# " + l.title + "\n\n" + [c && c.code, l.date].filter(Boolean).join(", ") + "\n";

  return o; }

function doExport(f) { const { l, c, d } = cur, base = slug((c ? c.code + " " : "") + l.title); closeModal();
  if (f === "pdf") { Object.assign(state, { tab: "notes", onlyOff: false, edit: false }); render(); setTimeout(() => window.print(), 200); return; }
  if (f === "anki") return download(base + "-flashcards.txt", d.flashcards.map(x => oneLine(x.q) + "\t" + oneLine(x.a)).join("\n"), "text/plain");

function addToCalendar(i) { const u = S._up[i], d = u.date.replace(/-/g, ""), next = new Date(new Date(u.date).getTime() + 864e5).toISOString().slice(0, 10).replace(/-/g, ""), e = s => String(s).replace(/([,;\\])/g, "\\$1").replace(/\n/g, "\\n");
  download(slug(u.course + " " + u.kind) + ".ics", ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Sidenote//EN", "BEGIN:VEVENT", "UID:" + u.lecture + "-" + u.t + "@sidenote", "DTSTAMP:" + new Date().toISOString().replace(/[-:]|\.\d+/g, ""), "DTSTART;VALUE=DATE:" + d, "DTEND;VALUE=DATE:" + next, "SUMMARY:" + e(u.course + " " + u.kind), "DESCRIPTION:" + e(u.text), "END:VEVENT", "END:VCALENDAR"].join("\r\n"), "text/calendar"); }

/* ---------- quiz helpers and keyboard ---------- */
function quizOrder() { return state.order || cur.d.quiz.map((_, i) => i); }
function pick(i) { if (state.picked !== null || state.done) return; const o = quizOrder(), q = cur.d.quiz[o[state.qi]]; if (!q || i >= q.opts.length) return; state.picked = i; if (i === q.a) state.score++; else state.wrong.push(o[state.qi]); render(); }
function nextQ() { if (state.picked === null) return; if (state.qi + 1 < quizOrder().length) { state.qi++; state.picked = null; } else { state.done = true; progress(); } render(); }
function restartQuiz() { Object.assign(state, { qi: 0, picked: null, score: 0, done: false, order: null, wrong: [] }); render(); }
function retryMissed() { Object.assign(state, { order: state.wrong.slice(), qi: 0, picked: null, score: 0, done: false, wrong: [] }); render(); }
document.addEventListener("keydown", e => {
  if (!cur || !cur.d || (R.a !== "lecture" && R.a !== "s") || $("#overlay").firstChild || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName) || e.metaKey || e.ctrlKey || e.altKey) return;
  if (state.tab === "cards") { if (e.key === "ArrowRight") card(1); else if (e.key === "ArrowLeft") card(-1); else if (e.key === " " && e.target.tagName !== "BUTTON") { e.preventDefault(); state.flip = !state.flip; render(); } }
  else if (state.tab === "quiz" && !state.done) { if (/^[1-9]$/.test(e.key)) pick(+e.key - 1); else if (e.key === "Enter" && e.target.tagName !== "BUTTON") nextQ(); }
});

function trs(s) { if (LANG === "en" || !s) return s; const k = s.replace(/\s+/g, " ").trim(); if (!k) return s; let o = ZH[k];
  if (o == null) for (const [re, fn] of ZHR) { const m = k.match(re); if (m) { o = fn(m); break; } }
  return o == null ? s : s.match(/^\s*/)[0] + o + s.match(/\s*$/)[0]; }

function setLang(l) { LANG = l === "zh" ? "zh" : "en"; store.set("lang", LANG); document.documentElement.lang = LANG === "zh" ? "zh-Hant" : "en"; render(); tr(document.body); }
const langBtn = () => `<button class="lang" data-notr onclick="setLang(LANG==='en'?'zh':'en')" aria-label="Switch language">${LANG === "en" ? "中文" : "EN"}</button>`;

/* ---------- router ---------- */
const PUBLIC = ["", "s", "signin"];
async function route() {

  if (!PUBLIC.includes(a) && !S.token) { S.next = location.hash; location.hash = "#/signin"; return; }
  if (a === "signin" && S.token) { location.hash = "#/home"; return; }
  if (a === "live" && !live.active) { location.hash = "#/new"; return; }
  const changed = R.a !== a || R.b !== b; R = { a, b }; const seq = ++routeSeq; S.error = null;
  if (changed) { plStop(); window.scrollTo(0, 0); if (a === "lecture" || a === "s") Object.assign(state, { tab: "notes", hit: null, pos: pendingPos || 0, fc: 0, flip: false, known: new Set(), qi: 0, picked: null, score: 0, done: false, onlyOff: false, zh: !!S.settings.zhDefault, tq: "", edit: false, order: null, wrong: [] }); pendingPos = 0; }
  const needHome = !PUBLIC.includes(a) && !S.homeLoaded, needLec = a === "lecture" && !(b in S.detail), needSh = a === "s" && !S.shared[b], needPack = a === "pack" && !S.pack[b], needPlans = a === "settings" && !S.plans;
  if (needHome || needLec || needSh || needPack || needPlans) $("#app").innerHTML = S.homeLoaded && !PUBLIC.includes(a) ? shell(skeleton(), "") : `<div class="center">${sid(56, "wow")}</div>`;
  try {
    if (needHome) { const r = await api.getHome(); Object.assign(S, r); S.settings = r.settings || S.settings; S.homeLoaded = true; session.save(); if (a === "lecture" || a === "s") state.zh = !!S.settings.zhDefault; }
    if (needLec) { const r = await api.getLecture(b); S.detail[b] = r.detail; const i = S.lectures.findIndex(x => x.id === b); if (i < 0) S.lectures.unshift(r.lecture); else S.lectures[i] = r.lecture; }
    if (needSh) S.shared[b] = await api.getShared(b);
    if (needPack) S.pack[b] = await api.getReviewPack(b);
    if (needPlans) S.plans = await api.getPlans().catch(() => ({ plans: [], current: null }));   // Settings still opens when the plans endpoint is not there yet
    if (changed && a === "lecture" && S.detail[b] && S.detail[b].progress) state.known = new Set(S.detail[b].progress.known || []);

function render() {

  else app.innerHTML = a === "home" ? home() : a === "course" ? coursePage(b) : a === "courses" ? coursesPage() : a === "lecture" ? lecturePage(b) : a === "s" ? sharedPage(b) : a === "new" ? newPage() : a === "live" ? livePage() : a === "pack" ? packPage(b) : a === "settings" ? settingsPage() : a === "signin" ? signinPage() : a === "" ? landing() : shell(problem("Page not found", "That address does not match anything in Sidenote."), "");

  tr(app);
